[package]
name = "zeron-engine"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
zeron-preview.workspace = true
zeron-proto.workspace = true
zeron-doc.workspace = true
zeron-sync.workspace = true
zeron-harness.workspace = true
zeron-rpc.workspace = true
zeron-update.workspace = true
loro.workspace = true
tokio.workspace = true
futures.workspace = true
async-trait.workspace = true
serde.workspace = true
serde_json.workspace = true
rusqlite.workspace = true
anyhow.workspace = true
thiserror.workspace = true
tracing.workspace = true
uuid.workspace = true
chrono.workspace = true
notify.workspace = true
portable-pty.workspace = true
base64 = "0.22"
gethostname.workspace = true
tokio-util = { workspace = true, features = ["rt"] }
sha2.workspace = true
reqwest.workspace = true
ignore.workspace = true
nucleo-matcher.workspace = true

tempfile.workspace = true

# `flock` for the single-instance lock and the device-id lock; nothing on
# Windows needs libc (the equivalents come from windows-sys below).
[target.'cfg(unix)'.dependencies]
libc.workspace = true

# Win32 pieces with no stable std equivalent on 1.95: LockFileEx/UnlockFileEx for
# the single-instance lock, GetFileInformationByHandle for file identity (the
# std accessors are still behind the unstable `windows_by_handle` feature).
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
] }

[dev-dependencies]
tokio-tungstenite.workspace = true
# In-process registry server for the two-engine workspace integration tests.
zeron-sync = { workspace = true, features = ["mock-server"] }
