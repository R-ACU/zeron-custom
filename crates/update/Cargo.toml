[package]
name = "zeron-update"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
anyhow.workspace = true
futures.workspace = true
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
tokio.workspace = true
tracing.workspace = true

# spawn_windows_apply: clear the inherit flag on this process's std handles
# before spawning the detached update helper, so neither it nor the app it
# relaunches keeps a caller's pipe open. Same windows-sys version as the
# other crates.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_System_Console",
] }

[dev-dependencies]
tempfile.workspace = true
